    <div class="seg" role="tablist" aria-label="Filter by topic" id="tagSeg" style="margin-bottom:26px">
      <button aria-selected="true" data-tag="">All</button>
      <button aria-selected="false" data-tag="Results">Results</button>
      <button aria-selected="false" data-tag="Coaching">Coaching</button>

      <button aria-selected="false" data-tag="Announcements">Announcements</button>
    </div>

    <div class="news3" id="gridSlot"></div>

</main>

<div id="site-footer"></div>
<div class="toast" id="toast" role="status"></div>

<script src="assets/site.js"></script>
<script>
(function(){
  const V=window.VDRSA, d=V.data;

  const bp=document.getElementById("bannerPhoto");
  if(bp)bp.style.backgroundImage=`url('${V.photo("trio",1600)}')`;

  const PAGE_SIZE=3;
  const TAGB={Results:"b-blue",Coaching:"b-amber",Schools:"b-green",Announcements:"b-grey"};
  let state={tag:"",page:1};

  function fmt(iso){return new Date(iso).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})}

  function filtered(){
    return state.tag?d.news.filter(n=>n.tag===state.tag):d.news;
  }

  function render(){
    const list=filtered().slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
    const feature=state.page===1?list[0]:null;
    const rest=state.page===1?list.slice(1):list;
    const totalPages=Math.max(1,Math.ceil(rest.length/PAGE_SIZE)+(state.page===1?1:0));
    const pageItems=state.page===1?rest.slice(0,PAGE_SIZE):rest.slice((state.page-2)*PAGE_SIZE,(state.page-1)*PAGE_SIZE);

    document.getElementById("featureSlot").innerHTML=feature?`
      <article class="card news feature" data-anim="up">
        <div class="ph" style="background-image:url('${V.img(feature.img,900)}')" role="img" aria-label="${V.esc(feature.title)}" data-cursor="view" data-cursor-label="View"></div>
        <div class="body">
          <span class="date"><span class="badge ${TAGB[feature.tag]||"b-blue"}">${feature.tag}</span>${fmt(feature.date)}</span>
          <h3>${V.esc(feature.title)}</h3>
          <p>${V.esc(feature.excerpt)}</p>
        </div>
      </article>`:"";

    document.getElementById("gridSlot").setAttribute("data-anim","stagger");
    document.getElementById("gridSlot").innerHTML=pageItems.map(n=>`
      <article class="card news">
        <div class="ph" style="background-image:url('${V.img(n.img,600)}')" role="img" aria-label="${V.esc(n.title)}" data-cursor="view" data-cursor-label="View"></div>
        <div class="body">
          <span class="date"><span class="badge ${TAGB[n.tag]||"b-blue"}">${n.tag}</span>${fmt(n.date)}</span>
          <h3>${V.esc(n.title)}</h3>
          <p>${V.esc(n.excerpt)}</p>
        </div>
      </article>`).join("");

    const empty=document.getElementById("emptyState");
    const showEmpty=list.length===0;
    empty.innerHTML=showEmpty?`<div class="card empty"><span class="ic"><i data-lucide="newspaper"></i></span><p>No news items in this topic.</p><button type="button" id="emptyReset">Show all news</button></div>`:"";
    if(showEmpty)document.getElementById("emptyReset").onclick=()=>{state={tag:"",page:1};[...document.querySelectorAll("#tagSeg button")].forEach(b=>b.setAttribute("aria-selected",b.dataset.tag===""));render();};

    const pager=document.getElementById("pager");
    if(totalPages<=1){pager.innerHTML="";}else{
      let html=`<button class="nav" ${state.page===1?"disabled":""} data-p="${state.page-1}"><i data-lucide="chevron-left"></i>Prev</button>`;
      for(let i=1;i<=totalPages;i++)html+=`<button aria-current="${i===state.page}" data-p="${i}">${i}</button>`;
      html+=`<button class="nav" ${state.page===totalPages?"disabled":""} data-p="${state.page+1}">Next<i data-lucide="chevron-right"></i></button>`;
      pager.innerHTML=html;
      [...pager.querySelectorAll("button")].forEach(b=>b.onclick=()=>{state.page=+b.dataset.p;render();window.scrollTo({top:document.getElementById("news-title").offsetTop-100,behavior:"smooth"});});
    }
    V.icons();V.animate(document.querySelector("#news-title").closest("section"));
  }

  document.getElementById("tagSeg").addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    [...document.querySelectorAll("#tagSeg button")].forEach(x=>x.setAttribute("aria-selected","false"));
    b.setAttribute("aria-selected","true");
    state.tag=b.dataset.tag;state.page=1;render();
  });

  render();
  V.icons();
  V.animate();
})();
</script>
